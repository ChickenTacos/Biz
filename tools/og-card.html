<html lang="en-CA" data-theme="dark">

<link rel="stylesheet" href="../assets/css/main.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1f2bff; }
  .og { position: relative; width: 1200px; height: 630px; background: var(--blue); color: #fff; overflow: hidden; }

  .og__brand .mark { width: 44px; height: 44px; --mark-strap: #fff; --mark-card: var(--yellow); }
  .og__brand .blink { color: var(--yellow); animation: none; }
  .og__title { margin: 0; font: 800 96px/.9 var(--f-mono); font-stretch: 112.5%; letter-spacing: -.055em; }
  .og__title span { display: block; }
  .og__title i { font-style: normal; color: var(--yellow); }

</style>
</head>

<div class="og">
