# Example nginx server block for the Lanyard site.
# 1. Copy the site to /var/www/lanyard (everything except deploy/ and tools/).
# 2. Copy security-headers.conf to /etc/nginx/snippets/lanyard-security-headers.conf
# 3. Copy this file to /etc/nginx/sites-available/, adjust server_name and the
#    certificate paths, link it into sites-enabled, then: nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d lanyard.example -d www.lanyard.example

server {
    listen 80;
    listen [::]:80;
    server_name lanyard.example www.lanyard.example;
    return 301 https://lanyard.example$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanyard.example;

    ssl_certificate     /etc/letsencrypt/live/lanyard.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanyard.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lanyard;
    index index.html;
    charset utf-8;
    server_tokens off;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    location / {
        include snippets/lanyard-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js)$ {
        include snippets/lanyard-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(?:woff2|png|svg|ico)$ {
        include snippets/lanyard-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /site.webmanifest {
        include snippets/lanyard-security-headers.conf;
        default_type application/manifest+json;
    }

    # Keep build tooling and server configs off the public site
    location ~ ^/(?:deploy|tools)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
}
